resources:
  jobs:
    insurance_pipeline:
      name: insurance_pipeline_${bundle.target}

      parameters:
        - name: as_of_date
          default: "2026-04-01"

      schedule:
        quartz_cron_expression: "0 0 6 2 * ?"   # tanggal 2 setiap bulan, 06:00
        timezone_id: Asia/Jakarta
        pause_status: PAUSED

      environments:
        - environment_key: default
          spec:
            environment_version: "2"           # CLI lama: ganti jadi  client: "2"
            dependencies:
              - pyyaml

      tasks:
        - task_key: readiness_check
          environment_key: default
          max_retries: 3                       # pengganti loop time.sleep di CDSW
          min_retry_interval_millis: 600000    # tunggu 10 menit antar percobaan
          spark_python_task:
            python_file: ../src/main.py
            parameters: ["--env", "${bundle.target}", "--step", "readiness_check", "--as-of-date", "{{job.parameters.as_of_date}}"]

        - task_key: policy_portfolio
          depends_on: [{task_key: readiness_check}]
          environment_key: default
          spark_python_task:
            python_file: ../src/main.py
            parameters: ["--env", "${bundle.target}", "--step", "policy_portfolio", "--as-of-date", "{{job.parameters.as_of_date}}"]

        - task_key: customer_360
          depends_on: [{task_key: policy_portfolio}]
          environment_key: default
          spark_python_task:
            python_file: ../src/main.py
            parameters: ["--env", "${bundle.target}", "--step", "customer_360", "--as-of-date", "{{job.parameters.as_of_date}}"]

        - task_key: quality
          depends_on: [{task_key: customer_360}]
          environment_key: default
          spark_python_task:
            python_file: ../src/main.py
            parameters: ["--env", "${bundle.target}", "--step", "quality", "--as-of-date", "{{job.parameters.as_of_date}}"]